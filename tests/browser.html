<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NMD browser checks</title>
<style>body{font:14px Arial;background:#121a22;color:#eef4f8}#fixture{width:320px}li{margin:5px}li.fail{color:#ff9292}</style>
<h1>NMD browser checks — sample data only</h1><p id="summary">Running…</p><ol id="results"></ol><div id="fixture"></div>
<script type="module">
import '../nmd-media-card.js';
const results=[];
const assert=(condition,message)=>{if(!condition)throw new Error(message);};
const tick=()=>new Promise(resolve=>setTimeout(resolve,0));
const a='media_player.a',b='media_player.b',c='media_player.c';
const entity=(id,state='playing',attrs={})=>({entity_id:id,state,attributes:{app_name:'Plex',media_title:'Example film',entity_picture:'/demo/horizon.svg',media_duration:100,media_position:30,supported_features:16385,...attrs}});
let card,states,calls,hass;
function setup(values,config={type:'custom:nmd-media-card',devices:[{entity:a,name:'Lounge'},{entity:b,name:'Den'}]}){
  card?.remove();calls=[];states=values;card=document.createElement('nmd-media-card');
  hass={states,hassUrl:path=>path,callService:async(...args)=>{calls.push(args);}};
  card.setConfig(config);card.hass=hass;document.getElementById('fixture').append(card);return card.shadowRoot;
}
function refresh(){card.hass={...hass,states};}
async function test(name,run){try{await run();results.push({name,pass:true});}catch(error){results.push({name,pass:false,error:error.message});}const li=document.createElement('li');li.textContent=`${results.at(-1).pass?'PASS':'FAIL'}: ${name}${results.at(-1).error?' — '+results.at(-1).error:''}`;li.className=results.at(-1).pass?'':'fail';document.getElementById('results').append(li);}
await test('Idle clears programme data and shows both room statuses',()=>{const r=setup({[a]:entity(a,'idle'),[b]:entity(b,'off')});assert(r.textContent.includes('Nothing playing'),'idle title');assert(!r.querySelector('.backdrop'),'stale artwork');assert(!r.querySelector('button'),'idle controls');assert(r.querySelectorAll('.statuses > span').length===2,'both rooms');});
await test('One player has artwork, logo, progress and correctly labelled control',()=>{const r=setup({[a]:entity(a),[b]:entity(b,'off')});assert(r.querySelector('.backdrop'),'backdrop');assert(r.querySelector('.app').getAttribute('aria-label')==='Plex','app name');assert(r.querySelector('.control').getAttribute('aria-label')==='Pause Lounge','pause');assert(r.querySelector('[role=progressbar]').getAttribute('aria-valuenow')==='30','progress');});
await test('Pause targets exactly the selected media player',async()=>{setup({[a]:entity(a),[b]:entity(b)}).querySelector('.control').click();await tick();assert(calls.length===1,'one request');assert(JSON.stringify(calls[0])===JSON.stringify(['media_player','media_pause',{entity_id:a}]),'target and action');});
await test('Room switch updates title, artwork, app and control target',async()=>{const r=setup({[a]:entity(a),[b]:entity(b,'playing',{app_name:'Emby',media_title:'Other film',entity_picture:'/demo/beyond.svg'})});r.querySelector('.other').click();assert(r.querySelector('.room').textContent==='Den','room');assert(r.querySelector('.title').textContent==='Other film','title');assert(r.querySelector('.backdrop').src.endsWith('/demo/beyond.svg'),'artwork');assert(r.querySelector('.app').getAttribute('aria-label')==='Emby','app');r.querySelector('.control').click();await tick();assert(calls[0][2].entity_id===b,'target');});
await test('Selection survives unrelated HA updates and pause',()=>{const r=setup({[a]:entity(a),[b]:entity(b)});r.querySelector('.other').click();states[b]=entity(b,'paused');refresh();assert(r.querySelector('.room').textContent==='Den','retained room');assert(r.querySelector('.control').getAttribute('aria-label')==='Resume Den','resume');});
await test('Selection falls back when selected player stops',()=>{const r=setup({[a]:entity(a),[b]:entity(b)});r.querySelector('.other').click();states[b]=entity(b,'idle');refresh();assert(r.querySelector('.room').textContent==='Lounge','fallback');});
await test('Unsupported play/pause is omitted',()=>{const r=setup({[a]:entity(a,'playing',{supported_features:0}),[b]:entity(b,'off')});assert(!r.querySelector('.control'),'unsupported control');});
await test('Assumed playback remains app-only with no progress or controls',()=>{const r=setup({[a]:entity(a,'playing',{assumed_state:true,app_name:'TiviMate'}),[b]:entity(b,'off')});assert(r.textContent.includes('App open'),'app status');assert(r.textContent.includes('Playback not confirmed'),'honest status');assert(!r.querySelector('.backdrop'),'assumed artwork');assert(!r.querySelector('.control'),'assumed control');assert(!r.querySelector('.track'),'assumed progress');});
await test('Unavailable and unknown remain separate from idle',()=>{const r=setup({[a]:entity(a,'unknown'),[b]:entity(b,'unavailable')});assert(r.textContent.includes('No confirmed playback'),'uncertain heading');assert(r.textContent.includes('Unknown')&&r.textContent.includes('Unavailable'),'distinct labels');assert(!r.querySelector('.backdrop'),'cleared art');});
await test('Three active devices are selectable without a two-room limit',()=>{const r=setup({[a]:entity(a),[b]:entity(b),[c]:entity(c)},{devices:[a,b,c]});assert(r.querySelectorAll('.other').length===2,'both extra rooms');r.querySelectorAll('.other')[1].click();assert(card._selected===c,'third selected');});
await test('Entity text is rendered as text, never markup',()=>{const r=setup({[a]:entity(a,'playing',{media_title:'<img src=x onerror=alert(1)>'}),[b]:entity(b,'off')});assert(r.querySelector('.title').textContent.startsWith('<img'),'literal title');assert(!r.querySelector('.title img'),'no injected element');});
await test('Failed artwork disappears and failed logo restores the name',()=>{const r=setup({[a]:entity(a),[b]:entity(b,'off')});const img=r.querySelector('.backdrop');img.dispatchEvent(new Event('error'));assert(img.hidden,'art hidden');const logo=r.querySelector('.app img');logo.dispatchEvent(new Event('error'));assert(logo.hidden&&!r.querySelector('.app span').hidden,'name fallback');});
await test('Service failure is visible without exposing backend message',async()=>{const r=setup({[a]:entity(a),[b]:entity(b,'off')});hass.callService=async()=>{throw new Error('PRIVATE_BACKEND_VALUE');};r.querySelector('.control').click();await tick();assert(r.querySelector('[role=alert]'),'visible failure');assert(!r.textContent.includes('PRIVATE_BACKEND_VALUE'),'sanitized');assert(!r.querySelector('.control').disabled,'retry available');});
await test('Duplicate clicks while a request is pending send one request',async()=>{const r=setup({[a]:entity(a),[b]:entity(b,'off')});let release;hass.callService=(...args)=>{calls.push(args);return new Promise(resolve=>{release=resolve;});};r.querySelector('.control').click();r.querySelector('.control').click();assert(calls.length===1,'deduplicated');release();await tick();});
await test('Unchanged updates preserve the actual focused button',()=>{const r=setup({[a]:entity(a),[b]:entity(b)});const button=r.querySelector('.other');button.focus();refresh();assert(r.activeElement===button,'focus retained');assert(r.querySelector('.other')===button,'DOM retained');});
await test('App change with unchanged metadata does not keep old artwork',()=>{const r=setup({[a]:entity(a),[b]:entity(b,'off')});states[a]=entity(a,'playing',{app_name:'TiviMate'});refresh();assert(!r.querySelector('.backdrop'),'stale artwork removed');assert(!r.querySelector('.title').textContent.includes('Example film'),'stale title removed');});
await test('Card fits 320, 400, 455 and 520 px with long metadata',async()=>{const r=setup({[a]:entity(a,'playing',{media_title:'A very long programme title that should wrap naturally without pushing controls outside the card'}),[b]:entity(b)},{devices:[{entity:a,name:'A room with a longer configured name'},{entity:b,name:'Another room'}]});const fixture=document.getElementById('fixture');for(const width of [320,400,455,520]){fixture.style.width=width+'px';await tick();assert(r.querySelector('ha-card').scrollWidth<=width,`overflow at ${width}`);assert(r.querySelector('.control').getBoundingClientRect().width>=44,'touch target');}fixture.style.width='320px';});
await test('Keyboard focus remains on playback control during and after service request',async()=>{const r=setup({[a]:entity(a),[b]:entity(b,'off')});let release;hass.callService=()=>new Promise(resolve=>{release=resolve;});r.querySelector('.control').focus();r.querySelector('.control').click();assert(r.activeElement===r.querySelector('.control'),'focus while pending');assert(r.activeElement.getAttribute('aria-disabled')==='true','pending accessible');release();await tick();assert(r.activeElement===r.querySelector('.control'),'focus after request');});
await test('Unknown application names cannot use inherited object properties as logo URLs',()=>{for(const app of ['constructor','__proto__','toString']){const r=setup({[a]:entity(a,'playing',{app_name:app}),[b]:entity(b,'off')});assert(r.querySelector('.app').textContent===app,'name fallback');assert(!r.querySelector('.app img'),'no inherited logo');}});
await test('A previous configuration service error does not appear on the new configuration',async()=>{const r=setup({[a]:entity(a),[b]:entity(b,'off')});let reject;hass.callService=()=>new Promise((resolve,fail)=>{reject=fail;});r.querySelector('.control').click();card.setConfig({devices:[b]});reject(new Error('old configuration'));await tick();assert(!r.querySelector('[role=alert]'),'stale request error suppressed');});
await test('Disconnect clears the progress timer; reconnect starts one timer',()=>{setup({[a]:entity(a),[b]:entity(b,'off')});assert(card._timer,'timer active');card.remove();assert(card._timer===null,'timer cleared');document.getElementById('fixture').append(card);assert(card._timer,'timer restarted');});
card?.remove();
const passed=results.filter(result=>result.pass).length;
document.getElementById('summary').textContent=`${passed}/${results.length} passed`;
window.browserResults={passed,total:results.length,results};
document.documentElement.dataset.done='true';
</script></html>
